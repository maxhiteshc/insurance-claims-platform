spring:
  application:
    name: claim-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/insurance}

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: CLAIM_USER
    password: ${CLAIM_DB_PASSWORD:ClaimDb123}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
server:
  port: 8081
clients:
  policy-service:
    base-url: ${CLIENTS_POLICY_SERVICE_BASE_URL:http://localhost:8082}
  payment-service:
    base-url: ${CLIENTS_PAYMENT_SERVICE_BASE_URL:http://localhost:8083}
settlement:
  saga:
    recovery-delay-ms: ${SETTLEMENT_SAGA_RECOVERY_DELAY_MS:5000}
outbox:
  publisher:
    topic: claims.events
    fixed-delay-ms: 1000
    batch-size: 20
    max-retries: 5
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

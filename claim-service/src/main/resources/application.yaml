spring:
  application:
    name: claim-service

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: CLAIM_USER
    password: ${CLAIM_DB_PASSWORD:ClaimDb123}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
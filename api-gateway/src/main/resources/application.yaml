spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/insurance}
  cloud:
    gateway:
      routes:
        - id: claim-service
          uri: ${CLAIM_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/claims/**
        - id: policy-service
          uri: ${POLICY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/policies/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/payments/**
      default-filters:
        - RemoveRequestHeader=Cookie

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

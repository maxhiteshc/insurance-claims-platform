spring:
  application:
    name: payment-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/insurance}

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: PAYMENT_USER
    password: ${PAYMENT_DB_PASSWORD:PaymentDb123}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8083

payment:
  # 0.0 = always succeed, 1.0 = always fail. Useful for demonstrating Saga compensation.
  failure-rate: ${PAYMENT_FAILURE_RATE:0.2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
